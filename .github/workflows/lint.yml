name: Lint & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  shellcheck:
    name: shellcheck + bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check (bash -n)
        run: bash -n scancannon.sh

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Warnings and errors fail the build; style/info notes do not, so the
      # gate stays meaningful without being noisy. The script intentionally
      # targets Bash 3.2 (macOS), so a few 3.2-safe idioms are annotated with
      # inline `# shellcheck disable=` directives rather than "modernized".
      - name: Run shellcheck
        run: shellcheck --severity=warning scancannon.sh

      - name: Shellcheck test harness + stubs
        run: shellcheck --severity=warning tests/helpers.bash tests/stubs/*

  bats:
    name: bats test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin bats-core rather than using the distro package, so the runner's
      # bats version can't silently drift out from under the tests.
      - name: Install bats-core
        run: |
          git clone --depth 1 --branch v1.11.1 https://github.com/bats-core/bats-core.git "$HOME/bats-core"
          echo "$HOME/bats-core/bin" >> "$GITHUB_PATH"

      - name: Run bats suite
        run: bats --print-output-on-failure tests/
